name: Test, solve and deploy LAMAK v3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and workbook-backed data
        run: |
          node --check app.js
          node --check data/model.js
          node --test tests/*.test.cjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact MILP dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Recompute team-25 epsilon-constraint MILP reference
        run: python scripts/solve_exact.py
      - name: Verify solver outputs and syntax
        run: |
          node --check data/exact_team.js
          node --test tests/*.test.cjs
      - name: Package static dashboard
        run: |
          mkdir -p _site
          cp index.html app.js styles.css _site/
          cp -R data _site/data
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
