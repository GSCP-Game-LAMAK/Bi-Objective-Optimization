name: Test and deploy LAMAK v5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible MILP dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Regenerate certified source-backed MILP results
        run: python scripts/solve_exact_v5.py
      - name: Independently cross-check coefficients, constraints, optimal solutions and sensitivity
        run: python scripts/independent_crosscheck.py
      - name: Check syntax and all unit tests
        run: |
          node --check app.js
          node --check data/model.js
          node --check data/exact_v5.js
          node --test tests/v5.test.cjs
      - name: Build static GitHub Pages site
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          cp data/model.js data/workbook_model.json data/exact_v5.js data/exact_v5.json data/exact_v5_frontier.csv _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
