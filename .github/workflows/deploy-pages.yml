name: Validate and deploy LAMAK v6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent exact-solver dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Regenerate both bounded and unrestricted exact MILP results
        run: python scripts/solve_exact_v6.py
      - name: Independently verify source coefficients, anchors and 126 MILP optima
        run: python scripts/independent_crosscheck_v6.py
      - name: Validate JavaScript syntax and v6 application model
        run: |
          node --check app.js
          node --check data/model.js
          node --check data/exact_v6.js
          node --test tests/v6.test.cjs
      - name: Prepare self-contained GitHub Pages static output
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          cp data/model.js data/workbook_model.json data/exact_v6.js data/exact_v6.json data/exact_v6_frontier.csv _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated website
        id: deployment
        uses: actions/deploy-pages@v4
